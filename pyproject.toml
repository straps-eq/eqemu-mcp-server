[project]
name = "eqemu-mcp-server"
version = "0.5.0"
description = "MCP server for EQEmu — C++ source search, quest API, database, NPC/item/spawn/loot management, documentation"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp[cli]>=2.0.0,<3",
    "mysql-connector-python>=8.0.0",
]

[project.scripts]
eqemu-mcp = "server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.11.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["eqemu_mcp"]
py-modules = ["server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["E402", "E702", "I001"]
